name: Bug report
description: Something is broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please avoid pasting API keys, CV text, or other personal data.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Popup / dashboard UI
        - AI generation
        - Form fill (content scripts)
        - PDF / CV export
        - License / Pro tier
        - Job queue
        - Application tracker
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Job board (if applicable)
      options:
        - Greenhouse
        - LinkedIn Easy Apply
        - Indeed
        - Workday
        - N/A
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version
      description: From chrome://extensions or manifest
      placeholder: "1.2.0"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: "Chrome 136 / Windows 11"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I rebuilt the extension (`npm run build`) and reloaded it on chrome://extensions
          required: false
