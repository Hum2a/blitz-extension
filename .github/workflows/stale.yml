name: Stale issues

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: >
            This issue has been marked stale due to inactivity. It will be closed in 14 days
            unless there is new activity. Comment if this is still relevant.
          close-issue-message: >
            Closed due to inactivity. Feel free to reopen with updated details.
          stale-pr-message: >
            This pull request has been marked stale due to inactivity.
          exempt-issue-labels: "pinned,security,enhancement"
          exempt-pr-labels: "pinned,security"
          operations-per-run: 30
