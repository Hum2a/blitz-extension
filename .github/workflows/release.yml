name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack:
    name: Pack extension
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Pack for Chrome Web Store
        run: npm run pack

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: blitz-extension-${{ github.ref_name }}
          path: dist/blitz-extension-v*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/blitz-extension-v*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
