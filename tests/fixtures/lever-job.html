<!DOCTYPE html>
<html lang="en">
  <head>
    <meta property="og:site_name" content="Acme Labs" />
    <title>Senior Platform Engineer | Acme Labs</title>
    <script type="application/ld+json">
      {
        "@type": "JobPosting",
        "title": "Senior Platform Engineer",
        "description": "<p>Build reliable APIs and mentor engineers.</p>",
        "hiringOrganization": { "name": "Acme Labs" }
      }
    </script>
  </head>
  <body>
    <div class="posting-headline">
      <h2 data-qa="posting-name">Senior Platform Engineer</h2>
    </div>
    <div class="section page">
      <div class="content" data-qa="job-description">
        <p>We are hiring a Senior Platform Engineer to own our core services.</p>
        <ul>
          <li>Design scalable APIs</li>
          <li>Improve CI/CD pipelines</li>
        </ul>
      </div>
    </div>
    <form id="application-form">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" />
      <label for="resume">Resume</label>
      <input id="resume" name="resume" type="file" />
      <label for="why">Why do you want this role?</label>
      <textarea id="why" name="comments"></textarea>
    </form>
  </body>
</html>
